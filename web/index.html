<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="logos/site-logo-dark.svg" />
<title>Agent Speed</title>
<meta name="description" content="Public coding-agent / reasoning-model speed benchmark under real long-context load." />
<style>
:root, [data-theme="dark"]{
  color-scheme: dark;
  --bg:#0a0b0f; --panel:#111318; --panel2:#16181e;
  --line:#1e2128; --line2:#2a2e38; --text:#f0f1f4; --muted:#8b90a0; --muted2:#636978;
  --accent:#a8b0c0; --accent2:#eceef2;
  --good:#7dd3a8; --warn:#e6c07b; --bad:#e88a96;
  --topbar:rgba(10,11,15,.86);
  --row-head:#0e1015; --row-hover:#14171e; --row-line:#1a1d24;
  --track:#1b2230; --bar-from:#3c7bff; --bar-to:#58e0ff; --pill-bg:#16181e; --pill-border:#2a2e38;
  --tip-bg:#16181e; --tip-border:#2a2e38;
  --icon:#a8b0c0; --icon-hover:#f0f1f4;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,Menlo,monospace;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --bg:#f7f7f8; --panel:#ffffff; --panel2:#f3f4f6;
    --line:#e6e7eb; --line2:#d4d6dc; --text:#111318; --muted:#5c6170; --muted2:#8b90a0;
    --accent:#4b5160; --accent2:#111318;
    --good:#1f8a5b; --warn:#a86b00; --bad:#c23048;
    --topbar:rgba(247,247,248,.9);
    --row-head:#f3f4f6; --row-hover:#fafafa; --row-line:#eceef2;
    --track:#dde3ee; --bar-from:#2f6fed; --bar-to:#0b8fb5; --pill-bg:#f3f4f6; --pill-border:#e0e2e8;
    --tip-bg:#fff; --tip-border:#d4d6dc;
    --icon:#5c6170; --icon-hover:#111318;
  }
}
[data-theme="light"]{
  color-scheme: light;
  --bg:#f7f7f8; --panel:#ffffff; --panel2:#f3f4f6;
  --line:#e6e7eb; --line2:#d4d6dc; --text:#111318; --muted:#5c6170; --muted2:#8b90a0;
  --accent:#4b5160; --accent2:#111318;
  --good:#1f8a5b; --warn:#a86b00; --bad:#c23048;
  --topbar:rgba(247,247,248,.9);
  --row-head:#f3f4f6; --row-hover:#fafafa; --row-line:#eceef2;
  --track:#dde3ee; --bar-from:#2f6fed; --bar-to:#0b8fb5; --pill-bg:#f3f4f6; --pill-border:#e0e2e8;
  --tip-bg:#fff; --tip-border:#d4d6dc;
  --icon:#5c6170; --icon-hover:#111318;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
.shell{max-width:1600px;margin:0 auto;padding:0 32px;width:100%;box-sizing:border-box}
.main-shell{display:flex;flex-direction:column;align-items:center;padding-bottom:8px}

.topbar{height:56px;border-bottom:1px solid var(--line);background:var(--topbar);backdrop-filter:saturate(140%) blur(16px);position:sticky;top:0;z-index:40}
.topbar .shell{height:100%;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;letter-spacing:-.35px;color:var(--text)}
.brand img{width:28px;height:28px;border-radius:0;display:block;flex:0 0 auto}
.brand span{font-weight:500;color:var(--muted)}
.top-actions{display:flex;align-items:center;gap:2px}
.icon-btn{
  width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:8px;color:var(--icon);transition:background .15s ease,color .15s ease;
}
.icon-btn:hover{background:var(--panel2);color:var(--icon-hover)}
.icon-btn:focus-visible{outline:2px solid var(--line2);outline-offset:2px}
.icon-btn svg{width:18px;height:18px;display:block}
.icon-btn .lang-glyph{font-size:12px;font-weight:700;letter-spacing:-.2px;line-height:1;font-family:var(--sans)}

.hero{padding:40px 0 28px}
.hero .shell{text-align:center}
.hero h1{margin:0 auto;font-size:28px;line-height:1.25;letter-spacing:-.7px;font-weight:600;max-width:720px}
.hero p{margin:10px auto 0;color:var(--muted);font-size:14px;max-width:560px;line-height:1.65}

.board{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);box-shadow:0 1px 0 rgba(255,255,255,.02);width:max-content;max-width:100%;margin:0 auto}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;display:block;width:100%}
.table{
  display:grid;
  grid-template-columns: repeat(10, max-content);
  column-gap: 14px;
  row-gap: 0;
  justify-content: start;
  width: max-content;
  max-width: 100%;
  margin: 0;
  align-items: center;
  padding: 0 24px;
  box-sizing: border-box;
}
#rows{display:contents}
.table.is-empty{display:block;width:100%}
.table.is-empty #rows{display:block}
.table.is-empty .tr.head{display:none}
.tr{display:contents}
.tr > *{
  min-height: 52px;
  display: flex;
  align-items: center;
  border-bottom: 1px solid var(--row-line);
  box-sizing: border-box;
  padding: 8px 0;
  min-width: 0;
}
.tr.head > *{
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--row-head);
  min-height: 40px;
  border-bottom: 1px solid var(--line);
}
.tr:last-child{border-bottom:0}
.tr.head{
  min-height:44px;background:var(--row-head);color:var(--muted2);
  font-size:11px;font-weight:600;letter-spacing:.02em;position:sticky;top:0;z-index:2;
}
.tr.data:hover{background:var(--row-hover)}

.th{display:inline-flex;align-items:center;gap:4px;user-select:none;white-space:nowrap}
.th.sortable{cursor:pointer;border-radius:5px;padding:3px 5px;margin:-3px -5px}
.th.sortable:hover{color:var(--text);background:var(--panel2)}
.th.sortable.active{color:var(--text)}
.sort-ind{font-size:10px;opacity:.75;min-width:8px;font-weight:700}
.tip{
  position:relative;display:inline-flex;align-items:center;justify-content:center;
  width:14px;height:14px;border-radius:50%;border:1px solid var(--line2);
  color:var(--muted2);font-size:9px;font-weight:700;cursor:help;flex:0 0 auto;
}
.tip:hover,.tip:focus{color:var(--text);border-color:var(--muted);outline:none}
.tip[data-tip]:hover::after,.tip[data-tip]:focus::after{
  content:attr(data-tip);position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);
  width:max-content;max-width:260px;padding:8px 10px;border-radius:8px;z-index:30;
  background:var(--tip-bg);border:1px solid var(--tip-border);color:var(--text);
  font:500 12px/1.45 var(--sans);letter-spacing:0;box-shadow:0 12px 32px rgba(0,0,0,.22);
  pointer-events:none;white-space:normal;font-weight:500;
}

.cell-with-logo{display:flex;align-items:center;gap:8px;min-width:0}
.logo{width:22px;height:22px;object-fit:contain;flex:0 0 auto;display:block;background:transparent;border:0;padding:0;border-radius:0}
.logo.harness{width:22px;height:22px}
.model-name{font-weight:560;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.1px;min-width:0}
.pill{
  display:inline-flex;align-items:center;border:1px solid var(--pill-border);background:var(--pill-bg);
  color:var(--muted);border-radius:6px;padding:2px 7px;font-size:11px;white-space:nowrap;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;
}
.harness-cell{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);min-width:0}
.harness-cell span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.metric{font:560 13px/1.2 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.metric small{font-size:10px;color:var(--muted2);font-weight:500;margin-left:3px}
.metric.na{color:var(--muted2);font-weight:500}
.speed-cell{min-width:4.5rem;flex-direction:column;align-items:stretch;justify-content:center;gap:0}
.speed-track{width:100%;height:3px;background:var(--track, #1b2230);border-radius:4px;margin-top:5px;overflow:hidden}
.speed-fill{height:100%;background:linear-gradient(90deg,var(--bar-from,#3c7bff),var(--bar-to,var(--accent2,#58e0ff)));border-radius:4px;max-width:100%}
.plain{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.rate-hi{color:var(--good)}.rate-mid{color:var(--warn)}.rate-lo{color:var(--bad)}
.ttft.fast{color:var(--good)}.ttft.mid{color:var(--warn)}.ttft.slow{color:var(--bad)}
.num{font:500 12px/1.2 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.empty{padding:56px 20px;text-align:center;color:var(--muted);font-size:13px}

.explainer{margin:40px auto 64px;max-width:680px;width:100%;color:var(--muted);font-size:13px;line-height:1.75;text-align:left}
.explainer h2{margin:0 0 12px;font-size:15px;color:var(--text);font-weight:600;letter-spacing:-.2px}
.explainer h3{margin:24px 0 6px;font-size:13px;color:var(--text);font-weight:600}
.explainer p{margin:0 0 8px}
.explainer a{color:var(--accent2);text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}
.explainer a:hover{opacity:.8}

@media(max-width:720px){
  .shell{padding:0 16px}
  .hero{padding:28px 0 20px}
  .hero h1{font-size:22px}
  .tr{padding:0 12px;gap:6px}
}
</style>
</head>
<body>
<header class="topbar"><div class="shell">
  <div class="brand"><img id="site-logo" src="logos/site-logo-dark.svg" alt="" width="28" height="28" /><span>Agent <span>Speed</span></span></div>
  <div class="top-actions">
    <button type="button" class="icon-btn" id="theme-toggle" aria-label="Theme" title="Theme"></button>
    <a class="icon-btn" id="github-link" href="https://github.com/TuTouPower/agent_speed" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.009-.868-.014-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
    </a>
    <button type="button" class="icon-btn" id="lang-toggle" aria-label="Language" title="Language"><span class="lang-glyph" id="lang-glyph">EN</span></button>
  </div>
</div></header>

<section class="hero"><div class="shell">
  <h1 id="hero-title"></h1>
  <p id="hero-sub"></p>
</div></section>

<main class="shell main-shell">
  <section class="board" aria-label="leaderboard">
    <div class="table-wrap"><div class="table">
      <div class="tr head" id="thead"></div>
      <div id="rows"></div>
    </div></div>
  </section>

  <section class="explainer" id="about"></section>
</main>

<script>

</script>
</body>
</html>
