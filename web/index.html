<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="logos/site-logo-dark.svg" />
<title>Agent Speed</title>
<meta name="description" content="Public coding-agent / reasoning-model speed benchmark under real long-context load." />
<style>
:root, [data-theme="dark"]{
  color-scheme: dark;
  --bg:#0a0b0f; --panel:#111318; --panel2:#16181e;
  --line:#1e2128; --line2:#2a2e38; --text:#f0f1f4; --muted:#8b90a0; --muted2:#636978;
  --accent:#a8b0c0; --accent2:#eceef2;
  --good:#7dd3a8; --warn:#e6c07b; --bad:#e88a96;
  --topbar:rgba(10,11,15,.86);
  --row-head:#0e1015; --row-hover:#14171e; --row-line:#1a1d24;
  --track:#1b2230; --bar-from:#3c7bff; --bar-to:#58e0ff; --pill-bg:#16181e; --pill-border:#2a2e38;
  --tip-bg:#16181e; --tip-border:#2a2e38;
  --icon:#a8b0c0; --icon-hover:#f0f1f4;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,Menlo,monospace;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --bg:#f7f7f8; --panel:#ffffff; --panel2:#f3f4f6;
    --line:#e6e7eb; --line2:#d4d6dc; --text:#111318; --muted:#5c6170; --muted2:#8b90a0;
    --accent:#4b5160; --accent2:#111318;
    --good:#1f8a5b; --warn:#a86b00; --bad:#c23048;
    --topbar:rgba(247,247,248,.9);
    --row-head:#f3f4f6; --row-hover:#fafafa; --row-line:#eceef2;
    --track:#dde3ee; --bar-from:#2f6fed; --bar-to:#0b8fb5; --pill-bg:#f3f4f6; --pill-border:#e0e2e8;
    --tip-bg:#fff; --tip-border:#d4d6dc;
    --icon:#5c6170; --icon-hover:#111318;
  }
}
[data-theme="light"]{
  color-scheme: light;
  --bg:#f7f7f8; --panel:#ffffff; --panel2:#f3f4f6;
  --line:#e6e7eb; --line2:#d4d6dc; --text:#111318; --muted:#5c6170; --muted2:#8b90a0;
  --accent:#4b5160; --accent2:#111318;
  --good:#1f8a5b; --warn:#a86b00; --bad:#c23048;
  --topbar:rgba(247,247,248,.9);
  --row-head:#f3f4f6; --row-hover:#fafafa; --row-line:#eceef2;
  --track:#dde3ee; --bar-from:#2f6fed; --bar-to:#0b8fb5; --pill-bg:#f3f4f6; --pill-border:#e0e2e8;
  --tip-bg:#fff; --tip-border:#d4d6dc;
  --icon:#5c6170; --icon-hover:#111318;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
.shell{max-width:1600px;margin:0 auto;padding:0 32px;width:100%;box-sizing:border-box}
.main-shell{display:flex;flex-direction:column;align-items:center;padding-bottom:8px}

.topbar{height:56px;border-bottom:1px solid var(--line);background:var(--topbar);backdrop-filter:saturate(140%) blur(16px);position:sticky;top:0;z-index:40}
.topbar .shell{height:100%;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;letter-spacing:-.35px;color:var(--text)}
.brand img{width:28px;height:28px;border-radius:0;display:block;flex:0 0 auto}
.brand span{font-weight:500;color:var(--muted)}
.top-actions{display:flex;align-items:center;gap:2px}
.icon-btn{
  width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:8px;color:var(--icon);transition:background .15s ease,color .15s ease;
}
.icon-btn:hover{background:var(--panel2);color:var(--icon-hover)}
.icon-btn:focus-visible{outline:2px solid var(--line2);outline-offset:2px}
.icon-btn svg{width:18px;height:18px;display:block}
.icon-btn .lang-glyph{font-size:12px;font-weight:700;letter-spacing:-.2px;line-height:1;font-family:var(--sans)}

.hero{padding:40px 0 28px}
.hero .shell{text-align:center}
.hero h1{margin:0 auto;font-size:28px;line-height:1.25;letter-spacing:-.7px;font-weight:600;max-width:720px}
.hero p{margin:10px auto 0;color:var(--muted);font-size:14px;max-width:560px;line-height:1.65}

.board{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);box-shadow:0 1px 0 rgba(255,255,255,.02);width:max-content;max-width:100%;margin:0 auto}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;display:block;width:100%}
.table{
  display:grid;
  grid-template-columns: repeat(10, max-content);
  column-gap: 14px;
  row-gap: 0;
  justify-content: start;
  width: max-content;
  max-width: 100%;
  margin: 0;
  align-items: center;
  padding: 0 24px;
  box-sizing: border-box;
}
#rows{display:contents}
.table.is-empty{display:block;width:100%}
.table.is-empty #rows{display:block}
.table.is-empty .tr.head{display:none}
.tr{display:contents}
.tr > *{
  min-height: 52px;
  display: flex;
  align-items: center;
  border-bottom: 1px solid var(--row-line);
  box-sizing: border-box;
  padding: 8px 0;
  min-width: 0;
}
.tr.head > *{
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--row-head);
  min-height: 40px;
  border-bottom: 1px solid var(--line);
}
.tr:last-child{border-bottom:0}
.tr.head{
  min-height:44px;background:var(--row-head);color:var(--muted2);
  font-size:11px;font-weight:600;letter-spacing:.02em;position:sticky;top:0;z-index:2;
}
.tr.data:hover{background:var(--row-hover)}

.th{display:inline-flex;align-items:center;gap:4px;user-select:none;white-space:nowrap}
.th.sortable{cursor:pointer;border-radius:5px;padding:3px 5px;margin:-3px -5px}
.th.sortable:hover{color:var(--text);background:var(--panel2)}
.th.sortable.active{color:var(--text)}
.sort-ind{font-size:10px;opacity:.75;min-width:8px;font-weight:700}
.tip{
  position:relative;display:inline-flex;align-items:center;justify-content:center;
  width:14px;height:14px;border-radius:50%;border:1px solid var(--line2);
  color:var(--muted2);font-size:9px;font-weight:700;cursor:help;flex:0 0 auto;
}
.tip:hover,.tip:focus{color:var(--text);border-color:var(--muted);outline:none}
.tip[data-tip]:hover::after,.tip[data-tip]:focus::after{
  content:attr(data-tip);position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);
  width:max-content;max-width:260px;padding:8px 10px;border-radius:8px;z-index:30;
  background:var(--tip-bg);border:1px solid var(--tip-border);color:var(--text);
  font:500 12px/1.45 var(--sans);letter-spacing:0;box-shadow:0 12px 32px rgba(0,0,0,.22);
  pointer-events:none;white-space:normal;font-weight:500;
}

.cell-with-logo{display:flex;align-items:center;gap:8px;min-width:0}
.logo{width:22px;height:22px;object-fit:contain;flex:0 0 auto;display:block;background:transparent;border:0;padding:0;border-radius:0}
.logo.harness{width:22px;height:22px}
.model-name{font-weight:560;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.1px;min-width:0}
.pill{
  display:inline-flex;align-items:center;border:1px solid var(--pill-border);background:var(--pill-bg);
  color:var(--muted);border-radius:6px;padding:2px 7px;font-size:11px;white-space:nowrap;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;
}
.harness-cell{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);min-width:0}
.harness-cell span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.metric{font:560 13px/1.2 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.metric small{font-size:10px;color:var(--muted2);font-weight:500;margin-left:3px}
.metric.na{color:var(--muted2);font-weight:500}
.speed-cell{min-width:4.5rem;flex-direction:column;align-items:stretch;justify-content:center;gap:0}
.speed-track{width:100%;height:3px;background:var(--track, #1b2230);border-radius:4px;margin-top:5px;overflow:hidden}
.speed-fill{height:100%;background:linear-gradient(90deg,var(--bar-from,#3c7bff),var(--bar-to,var(--accent2,#58e0ff)));border-radius:4px;max-width:100%}
.plain{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.rate-hi{color:var(--good)}.rate-mid{color:var(--warn)}.rate-lo{color:var(--bad)}
.ttft.fast{color:var(--good)}.ttft.mid{color:var(--warn)}.ttft.slow{color:var(--bad)}
.num{font:500 12px/1.2 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.empty{padding:56px 20px;text-align:center;color:var(--muted);font-size:13px}

.explainer{margin:40px auto 64px;max-width:680px;width:100%;color:var(--muted);font-size:13px;line-height:1.75;text-align:left}
.explainer h2{margin:0 0 12px;font-size:15px;color:var(--text);font-weight:600;letter-spacing:-.2px}
.explainer h3{margin:24px 0 6px;font-size:13px;color:var(--text);font-weight:600}
.explainer p{margin:0 0 8px}
.explainer a{color:var(--accent2);text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}
.explainer a:hover{opacity:.8}

@media(max-width:720px){
  .shell{padding:0 16px}
  .hero{padding:28px 0 20px}
  .hero h1{font-size:22px}
  .tr{padding:0 12px;gap:6px}
}
</style>
</head>
<body>
<header class="topbar"><div class="shell">
  <div class="brand"><img id="site-logo" src="logos/site-logo-dark.svg" alt="" width="28" height="28" /><span>Agent <span>Speed</span></span></div>
  <div class="top-actions">
    <button type="button" class="icon-btn" id="theme-toggle" aria-label="Theme" title="Theme"></button>
    <a class="icon-btn" id="github-link" href="https://github.com/TuTouPower/agent_speed" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.009-.868-.014-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
    </a>
    <button type="button" class="icon-btn" id="lang-toggle" aria-label="Language" title="Language"><span class="lang-glyph" id="lang-glyph">EN</span></button>
  </div>
</div></header>

<section class="hero"><div class="shell">
  <h1 id="hero-title"></h1>
  <p id="hero-sub"></p>
</div></section>

<main class="shell main-shell">
  <section class="board" aria-label="leaderboard">
    <div class="table-wrap"><div class="table">
      <div class="tr head" id="thead"></div>
      <div id="rows"></div>
    </div></div>
  </section>

  <section class="explainer" id="about"></section>
</main>

<script>
(() => {
  const DATA_URL = "./latest.json";
  const THEME_KEY = "agent-speed-theme";
  const LANG_KEY = "agent-speed-lang";

  const I18N = {
    zh: {
      docTitle: "Agent Speed — Coding Agent 速度基准",
      heroTitle: "大模型速度测试",
      heroSub: "",
      themeSystem: "跟随系统",
      themeDark: "深色",
      themeLight: "浅色",
      langSwitch: "Switch to English",
      empty: "暂无数据",
      loadFail: "加载失败：",
      cols: {
        model: "模型",
        source: "来源",
        effort: "思考强度",
        harness: "客户端",
        e2e_tps: "端到端速度",
        gen_tps: "生成速度",
        ttft: "首字延迟",
        wall: "总耗时",
        in_tokens: "输入",
        out_tokens: "输出",
      },
      tips: {
        model: "参与评测的模型名称。",
        source: "服务来源 / 线路（官方、网关或代理渠道）。",
        effort: "思考强度档位。不支持调节时显示为 —。",
        harness: "运行框架 / 客户端（如 opencode、kimi-code、grok-build）。",
        e2e_tps: "端到端速度：输出 token 数 ÷ 总耗时（含排队、读入、思考、生成）。越高越快。",
        gen_tps: "生成速度：只统计模型真正在往外写字的那段时间。拿不到生成时间窗时显示 —。",
        ttft: "首字延迟（秒），从发出请求到看到第一个字，含思考。越低越好。",
        wall: "总耗时（秒）：从发出请求到全部输出完成一共花了多少秒。",
        in_tokens: "账单输入 token 的中位数（按服务商事件流口径）。",
        out_tokens: "账单输出 token 的中位数（按服务商事件流口径）。",
      },
      about: `<h2>实验说明</h2>
        <p>这是公开的 coding agent / 推理模型<strong>速度</strong>榜，只比快慢，不评回答质量。<strong>速度不是能力排名。</strong></p>
        <h3>怎么测</h3>
        <p>默认 200K 长上下文：固定 Django 语料 + 公开任务 prompt，禁止工具调用。每个「模型 × 来源 × 思考强度 × 客户端」会跑多次。</p>
        <h3>指标</h3>
        <p><strong>端到端速度</strong>：输出 token ÷ 总耗时（含排队、读入、思考、生成），越高越快。<strong>生成速度</strong>：只统计生成窗口；拿不到生成窗时留空。<strong>首字延迟</strong>：等到第一个字出现的秒数（含思考），越低越好。<strong>总耗时</strong>：从发出请求到全部输出完成的秒数。<strong>输入 / 输出</strong>：账单 token 中位数。</p>
        <h3>怎么上榜</h3>
        <p>每个格子取数据库里<strong>最近 2 次有效成功</strong>算中位数（可以跨不同 batch，不要求同一次 bench 凑满 2 次）。单次须成功、输出 token ≥ 500；这两次的账单输入中位数还要 ≥ 场景切片 cl100k 的一半（200K 场景下 ≥ 100,000）。</p>
        <h3>数据从哪来</h3>
        <p>页面读同目录 <code>latest.json</code>（评测仓用 <code>report.py</code> 从 <code>results.jsonl</code> 生成）。数据与页面一起发布。评测仓：<a href="https://github.com/TuTouPower/agent_speed" target="_blank" rel="noopener">TuTouPower/agent_speed</a>。</p>
      `,
    },
    en: {
      docTitle: "Agent Speed — Coding Agent Speed Benchmark",
      heroTitle: "LLM Speed Benchmark",
      heroSub: "",
      themeSystem: "System",
      themeDark: "Dark",
      themeLight: "Light",
      langSwitch: "切换到中文",
      empty: "No data yet",
      loadFail: "Failed to load: ",
      cols: {
        model: "Model",
        source: "Source",
        effort: "Effort",
        harness: "Client",
        e2e_tps: "End-to-end",
        gen_tps: "Generation",
        ttft: "Time to first token",
        wall: "Total time",
        in_tokens: "Input",
        out_tokens: "Output",
      },
      tips: {
        model: "Model under test.",
        source: "Provider / route (official, gateway, or proxy).",
        effort: "Reasoning effort. Shows — when not adjustable.",
        harness: "Client / harness (e.g. opencode, kimi-code, grok-build).",
        e2e_tps: "End-to-end speed: output tokens ÷ total elapsed time (queue, ingest, thinking, generation). Higher is faster.",
        gen_tps: "Generation speed: only the window where tokens are actually streaming. Shows — when that window is unavailable.",
        ttft: "Seconds from request to the first output token, including thinking. Lower is better.",
        wall: "Total elapsed seconds from sending the request until all output finished.",
        in_tokens: "Median billed input tokens (provider event-stream accounting).",
        out_tokens: "Median billed output tokens (provider event-stream accounting).",
      },
      about: `<h2>About</h2>
        <p>A public <strong>speed</strong> board for coding agents / reasoning models. It measures speed only — not answer quality. <strong>Speed is not a capability ranking.</strong></p>
        <h3>How we measure</h3>
        <p>Default scenario is 200K long context: fixed Django corpus + public task prompt, tools disabled. Each model × source × effort × harness cell is run multiple times.</p>
        <h3>Metrics</h3>
        <p><strong>E2E speed</strong>: output tokens ÷ total elapsed time (queue, read, think, generate) — higher is faster. <strong>Gen speed</strong>: generate-window only; blank when unavailable. <strong>TTFT</strong>: seconds until first token (incl. thinking) — lower is better. <strong>Total time</strong>: seconds from request to finished output. <strong>Input / Output</strong>: median billed tokens.</p>
        <h3>Listing rules</h3>
        <p>Per cell we take the <strong>latest 2 valid successes</strong> in the database (may span batches; same-bench pair not required). Each run must succeed with output tokens ≥ 500; median billed input of those two must be ≥ half the scenario cl100k slice (≥ 100,000 for 200K).</p>
        <h3>Data</h3>
        <p>The page loads sibling <code>latest.json</code> (from <code>report.py</code> over <code>results.jsonl</code>). Data ships with the static page. Repo: <a href="https://github.com/TuTouPower/agent_speed" target="_blank" rel="noopener">TuTouPower/agent_speed</a>.</p>
      `,
    },
  };

  // light = for light background; dark = for dark background (浅色描边/白标)
  const MODEL_LOGO = [
    [/deepseek/i, { light: "logos/deepseek.svg", dark: "logos/deepseek.svg" }],
    [/gemini/i, { light: "logos/gemini.svg", dark: "logos/gemini.svg" }],
    [/gpt|openai/i, { light: "logos/openai.svg", dark: "logos/openai-light.svg" }],

    [/^k2|kimi|moonshot/i, { light: "logos/kimi-dark.svg", dark: "logos/kimi-light.svg" }],
    [/mimo/i, { light: "logos/mimo.svg", dark: "logos/mimo-light.svg" }],
    [/muse|spark/i, { light: "logos/muse.svg", dark: "logos/muse-light.svg" }],
  ];
  const HARNESS_LOGO = {
    "opencode": { light: "logos/opencode.svg", dark: "logos/opencode-light.svg" },
    "grok-build": { light: "logos/grok.svg", dark: "logos/grok-light.svg" },
    "kimi-code": { light: "logos/kimi-dark.svg", dark: "logos/kimi-light.svg" },
    "kimi": { light: "logos/kimi-dark.svg", dark: "logos/kimi-light.svg" },
    "antigravity": { light: "logos/antigravity.svg", dark: "logos/antigravity.svg" },
    "codex": { light: "logos/codex.svg", dark: "logos/codex.svg" },
  };

  const COLS = [
    { key: "model", sortable: true, tip: false },
    { key: "effort", sortable: true, tip: false },
    { key: "harness", sortable: true },
    { key: "e2e_tps", sortable: true },
    { key: "gen_tps", sortable: true },
    { key: "ttft", sortable: true },
    { key: "wall", sortable: true },
    { key: "in_tokens", sortable: true },
    { key: "out_tokens", sortable: true },
    { key: "source", sortable: true },
  ];

  const ICONS = {
    sun: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>`,
    moon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 14.5A8.5 8.5 0 1111.5 3a7 7 0 009.5 11.5z"/></svg>`,
    monitor: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>`,
  };

  const state = {
    rows: [],
    sortKey: "e2e_tps",
    sortDir: "desc",
    error: null,
    lang: "zh",
    theme: "system",
  };

  const $ = (s) => document.querySelector(s);
  const t = () => I18N[state.lang];

  function detectLang() {
    const saved = localStorage.getItem(LANG_KEY);
    if (saved === "zh" || saved === "en") return saved;
    const nav = (navigator.language || "en").toLowerCase();
    return nav.startsWith("zh") ? "zh" : "en";
  }

  function fmtToks(n) {
    if (n == null || Number.isNaN(Number(n))) return "—";
    const v = Number(n);
    if (v >= 1e6) return (v / 1e6).toFixed(v >= 1e7 ? 1 : 2).replace(/\.0$/, "") + "M";
    if (v >= 1000) {
      const k = v / 1000;
      return (k >= 100 ? Math.round(k).toString() : k.toFixed(1).replace(/\.0$/, "")) + "K";
    }
    return String(Math.round(v));
  }
  function fmtRate(n) {
    if (n == null || Number.isNaN(Number(n))) return null;
    return Number(n).toFixed(1);
  }
  function fmtSec(n) {
    if (n == null || Number.isNaN(Number(n))) return null;
    const v = Number(n);
    return (Math.round(v * 1000) / 1000).toLocaleString("en-US", { maximumFractionDigits: 3 });
  }
  function effortText(e) { return e == null || e === "" ? "" : String(e); }
  function effectiveDark() {
    if (state.theme === "dark") return true;
    if (state.theme === "light") return false;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function pickLogo(spec) {
    if (!spec) return null;
    if (typeof spec === "string") return spec;
    return effectiveDark() ? (spec.dark || spec.light) : (spec.light || spec.dark);
  }
  function modelLogo(name) {
    for (const [re, spec] of MODEL_LOGO) if (re.test(name || "")) return pickLogo(spec);
    return null;
  }
  function harnessLogo(h) { return pickLogo(HARNESS_LOGO[h]); }
  function logoImg(src, cls = "logo") {
    return src ? `<img class="${cls}" src="${src}" alt="" loading="lazy" decoding="async" />` : "";
  }
  function ttftClass(v) { return v == null ? "" : v < 12 ? "fast" : v < 25 ? "mid" : "slow"; }
  // 生成速度: >=200 / >=100 / rest; 端到端: >=100 / >=50 / rest
  function genClass(v) { return v == null ? "na" : v >= 200 ? "rate-hi" : v >= 100 ? "rate-mid" : "rate-lo"; }
  function e2eClass(v) { return v == null ? "na" : v >= 100 ? "rate-hi" : v >= 50 ? "rate-mid" : "rate-lo"; }


  function themeLabel(mode) {
    const i = t();
    return mode === "light" ? i.themeLight : mode === "dark" ? i.themeDark : i.themeSystem;
  }
  function themeIcon(mode) {
    return mode === "light" ? ICONS.sun : mode === "dark" ? ICONS.moon : ICONS.monitor;
  }
  function applyTheme(mode) {
    state.theme = mode;
    const root = document.documentElement;
    if (mode === "light" || mode === "dark") root.setAttribute("data-theme", mode);
    else root.removeAttribute("data-theme");
    const btn = $("#theme-toggle");
    const label = themeLabel(mode);
    btn.innerHTML = themeIcon(mode);
    btn.title = label;
    btn.setAttribute("aria-label", label);
    const logo = $("#site-logo");
    if (logo) logo.src = effectiveDark() ? "logos/site-logo-dark.svg" : "logos/site-logo-light.svg";
    renderRows();
  }
  function applyLang(lang) {
    state.lang = lang;
    localStorage.setItem(LANG_KEY, lang);
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.title = t().docTitle;
    $("#lang-glyph").textContent = lang === "zh" ? "EN" : "中";
    const lb = $("#lang-toggle");
    lb.title = t().langSwitch;
    lb.setAttribute("aria-label", t().langSwitch);
    $("#hero-title").textContent = t().heroTitle;
    const sub = $("#hero-sub");
    sub.textContent = t().heroSub || "";
    sub.hidden = !t().heroSub;
    $("#about").innerHTML = t().about;
    applyTheme(state.theme);
    renderHead();
    renderRows();
  }

  function sortedRows() {
    const key = state.sortKey;
    const dir = state.sortDir;
    const textKeys = new Set(["model", "effort", "harness", "source"]);
    return [...state.rows].sort((x, y) => {
      const xv = x[key], yv = y[key];
      if (textKeys.has(key)) {
        const xs = xv == null || xv === "" ? null : String(xv);
        const ys = yv == null || yv === "" ? null : String(yv);
        if (xs == null && ys == null) return 0;
        if (xs == null) return 1;
        if (ys == null) return -1;
        const diff = xs.localeCompare(ys, "zh", { sensitivity: "base", numeric: true });
        return dir === "asc" ? diff : -diff;
      }
      const xn = xv == null || xv === "" || Number.isNaN(Number(xv));
      const yn = yv == null || yv === "" || Number.isNaN(Number(yv));
      if (xn && yn) return 0;
      if (xn) return 1;
      if (yn) return -1;
      const diff = Number(xv) - Number(yv);
      return dir === "asc" ? diff : -diff;
    });
  }

  function renderHead() {
    const i = t();
    $("#thead").innerHTML = COLS.map((c) => {
      const tip = c.tip === false ? "" : `<span class="tip" tabindex="0" data-tip="${i.tips[c.key]}">?</span>`;
      if (!c.sortable) {
        return `<div class="th">${i.cols[c.key]}${tip ? " " + tip : ""}</div>`;
      }
      const active = state.sortKey === c.key;
      const ind = active ? (state.sortDir === "asc" ? "↑" : "↓") : "";
      return `<div class="th sortable ${active ? "active" : ""}" data-sort="${c.key}">${i.cols[c.key]} <span class="sort-ind" aria-hidden="true">${ind}</span>${tip ? " " + tip : ""}</div>`;
    }).join("");
    $("#thead").querySelectorAll(".th.sortable").forEach((th) => {
      th.addEventListener("click", (e) => {
        if (e.target.closest(".tip")) return;
        const key = th.dataset.sort;
        if (state.sortKey === key) {
          state.sortDir = state.sortDir === "desc" ? "asc" : "desc";
        } else {
          state.sortKey = key;
          state.sortDir = (key === "ttft" || key === "wall" || key === "model" || key === "effort" || key === "harness" || key === "source") ? "asc" : "desc";
        }
        renderHead();
        renderRows();
      });
    });
  }

  function renderRows() {
    const i = t();
    if (state.error) {
      $("#rows").innerHTML = `<div class="empty">${i.loadFail}${state.error}</div>`;
      return;
    }
    const rows = sortedRows();
    const maxE2e = Math.max(...rows.map((r) => Number(r.e2e_tps) || 0), 1);
    const maxGen = Math.max(...rows.map((r) => Number(r.gen_tps) || 0), 1);
    const tableEl = document.querySelector(".table");
    if (!rows.length) {
      if (tableEl) tableEl.classList.add("is-empty");
      $("#rows").innerHTML = `<div class="empty">${i.empty}</div>`;
      return;
    }
    if (tableEl) tableEl.classList.remove("is-empty");
    $("#rows").innerHTML = rows.map((r) => {
      const e2e = fmtRate(r.e2e_tps);
      const gen = fmtRate(r.gen_tps);
      const ttft = fmtSec(r.ttft);
      const wall = fmtSec(r.wall);
      const e2eBar = Math.max(0, Math.min(100, ((Number(r.e2e_tps) || 0) / maxE2e) * 100));
      const genBar = r.gen_tps == null ? 0 : Math.max(0, Math.min(100, (Number(r.gen_tps) / maxGen) * 100));
      const effort = effortText(r.effort);
      return `<div class="tr data">
        <div class="cell-with-logo">${logoImg(modelLogo(r.model))}<div class="model-name">${r.model || "—"}</div></div>
        <div class="plain">${effort}</div>
        <div><span class="harness-cell">${logoImg(harnessLogo(r.harness), "logo harness")}<span>${r.harness || "—"}</span></span></div>
        <div class="speed-cell"><div class="metric ${e2eClass(r.e2e_tps)}">${e2e == null ? "—" : e2e}${e2e == null ? "" : "<small>tok/s</small>"}</div><div class="speed-track"><div class="speed-fill" style="width:${e2eBar}%"></div></div></div>
        <div class="speed-cell"><div class="metric ${genClass(r.gen_tps)}">${gen == null ? "" : gen}${gen == null ? "" : "<small>tok/s</small>"}</div>${r.gen_tps == null ? "" : `<div class="speed-track"><div class="speed-fill" style="width:${genBar}%"></div></div>`}</div>
        <div class="metric">${ttft == null ? "—" : ttft}${ttft == null ? "" : "<small>s</small>"}</div>
        <div class="metric">${wall == null ? "—" : wall}${wall == null ? "" : "<small>s</small>"}</div>
        <div class="num">${fmtToks(r.in_tokens)}</div>
        <div class="num">${fmtToks(r.out_tokens)}</div>
        <div class="plain">${r.source || ""}</div>
      </div>`;
    }).join("");
  }

  // theme cycle: system → dark → light → system
  state.theme = localStorage.getItem(THEME_KEY) || "system";
  if (!["system", "dark", "light"].includes(state.theme)) state.theme = "system";
  // 点一下切到「当前实际显示」的反色；系统已是深色时不会再空切到深色
  $("#theme-toggle").onclick = () => {
    const next = effectiveDark() ? "light" : "dark";
    localStorage.setItem(THEME_KEY, next);
    applyTheme(next);
  };
  if (window.matchMedia) {
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
      if (state.theme === "system") renderRows();
    });
  }
  $("#lang-toggle").onclick = () => applyLang(state.lang === "zh" ? "en" : "zh");

  applyLang(detectLang());

  async function load() {
    try {
      const res = await fetch(DATA_URL, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      state.rows = Array.isArray(data) ? data : (data && Array.isArray(data.rows) ? data.rows : (() => { throw new Error("bad latest.json"); })());
      state.error = null;
      renderRows();
    } catch (e) {
      state.rows = [];
      state.error = e.message || String(e);
      renderRows();
    }
  }
  load();
})();
</script>
</body>
</html>
