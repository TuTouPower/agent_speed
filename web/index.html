<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="logos/site-logo-dark.svg" />
<title>Agent Speed</title>
<meta name="description" content="Public coding-agent / reasoning-model speed benchmark under real long-context load." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============ tokens: ink dark (default) ============ */
:root, [data-theme="dark"]{
  color-scheme: dark;
  --bg:#0a0c10; --panel:#0e1218; --panel2:#141a23;
  --line:#1c2330; --line2:#2a3345;
  --text:#e8edf5; --muted:#8b96a8; --muted2:#556173;
  --accent:#5e8bff; --accent-text:#7ba1ff; --accent-soft:rgba(94,139,255,.12);
  --good:#34d399; --warn:#fbbf24; --dim:#5c6675;
  --topbar:rgba(10,12,16,.82);
  --row-head:#0c1016; --row-hover:rgba(94,139,255,.05); --row-line:#161d29;
  --track:#1a2230; --bar-from:#5e8bff; --bar-to:#38e0ff;
  --pill-bg:#11161f; --pill-border:#232c3c;
  --tip-bg:#11161f; --tip-border:#2a3345;
  --icon:#8b96a8; --icon-hover:#e8edf5;
  --grid-line:rgba(94,139,255,.045);
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono","Cascadia Code",Consolas,Menlo,"PingFang SC","Microsoft YaHei",monospace;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --bg:#f7f8fa; --panel:#ffffff; --panel2:#f0f2f6;
    --line:#e3e7ee; --line2:#cbd3e0;
    --text:#0b0e13; --muted:#5a6575; --muted2:#98a2b3;
    --accent:#0c5eff; --accent-text:#0c5eff; --accent-soft:rgba(12,94,255,.08);
    --good:#0a8f5f; --warn:#a8760a; --dim:#a0aab8;
    --topbar:rgba(247,248,250,.86);
    --row-head:#f5f6f9; --row-hover:rgba(12,94,255,.04); --row-line:#e9edf3;
    --track:#e2e7f0; --bar-from:#0c5eff; --bar-to:#0ea5c9;
    --pill-bg:#f0f2f6; --pill-border:#dde2ec;
    --tip-bg:#ffffff; --tip-border:#cbd3e0;
    --icon:#5a6575; --icon-hover:#0b0e13;
    --grid-line:rgba(12,94,255,.05);
  }
}
[data-theme="light"]{
  color-scheme: light;
  --bg:#f7f8fa; --panel:#ffffff; --panel2:#f0f2f6;
  --line:#e3e7ee; --line2:#cbd3e0;
  --text:#0b0e13; --muted:#5a6575; --muted2:#98a2b3;
  --accent:#0c5eff; --accent-text:#0c5eff; --accent-soft:rgba(12,94,255,.08);
  --good:#0a8f5f; --warn:#a8760a; --dim:#a0aab8;
  --topbar:rgba(247,248,250,.86);
  --row-head:#f5f6f9; --row-hover:rgba(12,94,255,.04); --row-line:#e9edf3;
  --track:#e2e7f0; --bar-from:#0c5eff; --bar-to:#0ea5c9;
  --pill-bg:#f0f2f6; --pill-border:#dde2ec;
  --tip-bg:#ffffff; --tip-border:#cbd3e0;
  --icon:#5a6575; --icon-hover:#0b0e13;
  --grid-line:rgba(12,94,255,.05);
}

/* ============ base ============ */
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background-color .3s ease,color .3s ease;
}
/* blueprint hairline grid */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size:88px 88px;
  background-position:center top;
}
::selection{background:var(--accent);color:#fff}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
.shell{max-width:1440px;margin:0 auto;padding:0 40px;width:100%;box-sizing:border-box}
.main-shell{display:flex;flex-direction:column;align-items:stretch;padding-bottom:8px;position:relative;z-index:1}

/* ============ topbar ============ */
.topbar{height:58px;border-bottom:1px solid var(--line);background:var(--topbar);backdrop-filter:saturate(150%) blur(16px);-webkit-backdrop-filter:saturate(150%) blur(16px);position:sticky;top:0;z-index:40}
.topbar .shell{height:100%;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;letter-spacing:-.2px;color:var(--text)}
.brand img{width:24px;height:24px;display:block;flex:0 0 auto}
.brand .brand-word{display:inline-flex;align-items:center;gap:6px}
.brand .brand-word::after{content:"";width:6px;height:6px;background:var(--accent);margin-left:2px}
.brand span span{font-weight:500;color:var(--muted)}
.top-actions{display:flex;align-items:center;gap:6px}
.icon-btn{
  height:32px;min-width:32px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--line);color:var(--icon);transition:border-color .15s ease,color .15s ease,background .15s ease;
}
.icon-btn:hover{border-color:var(--line2);color:var(--icon-hover);background:var(--panel2)}
.icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon-btn svg{width:15px;height:15px;display:block}
.icon-btn .lang-glyph{font:600 10.5px/1 var(--mono);letter-spacing:.05em}

/* ============ masthead ============ */
.mast{padding:64px 0 34px;position:relative;z-index:1}
.mast-tags{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.tag{
  display:inline-flex;align-items:center;gap:8px;
  border:1px solid var(--line2);background:var(--panel);
  padding:5px 10px;font:500 10.5px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--text);white-space:nowrap;
}
.tag i{font-style:normal;color:var(--muted2)}
.tag i::after{content:":";margin-right:2px}
.tag.live i{color:var(--accent-text)}
.tag.live::before{content:"";width:5px;height:5px;background:var(--accent);animation:blink 1.6s steps(1) infinite}
@keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.2}}
.mast h1{
  margin:0;font-size:clamp(42px,6.8vw,86px);line-height:1.05;letter-spacing:-.04em;font-weight:800;
  max-width:960px;
}
.mast h1::after{
  content:"";display:inline-block;width:.13em;height:.8em;background:var(--accent);
  margin-left:.1em;transform:translateY(.07em);animation:blink 1.2s steps(1) infinite;
}
.mast p{margin:16px 0 0;color:var(--muted);font-size:14px;max-width:560px;line-height:1.7}
.hairline{
  margin-top:36px;height:11px;position:relative;border-bottom:1px solid var(--line);
}
.hairline::before,.hairline::after{
  content:"+";position:absolute;bottom:-8px;font:400 13px/1 var(--mono);color:var(--accent-text);
}
.hairline::before{left:-5px}
.hairline::after{right:-5px}

/* ============ board ============ */
.board-frame{position:relative;width:max-content;max-width:100%;margin:10px auto 0}
.x-corner{position:absolute;font:400 13px/1 var(--mono);color:var(--accent-text);pointer-events:none;z-index:5}
.x-corner.tl{top:-16px;left:-5px}
.x-corner.tr{top:-16px;right:-5px}
.x-corner.bl{bottom:-16px;left:-5px}
.x-corner.br{bottom:-16px;right:-5px}
.board{
  border:1px solid var(--line2);background:var(--panel);
  width:max-content;max-width:100%;margin:0 auto;overflow:hidden;
}
.board-bar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:0 16px;height:34px;border-bottom:1px solid var(--line);
  font:500 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted2);
}
.board-bar .b-live{display:inline-flex;align-items:center;gap:7px;color:var(--muted)}
.board-bar .b-live::before{content:"";width:5px;height:5px;background:var(--accent);animation:blink 1.6s steps(1) infinite}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;display:block;width:100%}
.table{
  display:grid;
  grid-template-columns: repeat(11, max-content);
  column-gap: 0;
  row-gap: 0;
  justify-content: start;
  width: max-content;
  max-width: 100%;
  margin: 0;
  align-items: center;
  padding: 0 24px;
  box-sizing: border-box;
}
#rows{display:contents}
.table.is-empty{display:block;width:100%}
.table.is-empty #rows{display:block}
.table.is-empty .tr.head{display:none}
.tr{display:contents}
.tr > *{
  min-height: 52px;
  display: flex;
  align-items: center;
  border-bottom: 1px solid var(--row-line);
  box-sizing: border-box;
  padding: 9px 12px;
  min-width: 0;
  transition: opacity .18s ease, background-color .18s ease;
}
.tr.head > *{
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--row-head);
  min-height: 40px;
  border-bottom: 1px solid var(--line2);
}
.tr.data:hover > *{background:var(--row-hover)}
/* hover cascade: dim sibling rows (.table, not #rows — #rows is display:contents) */
.table:hover .tr.data > *{opacity:.4}
.table .tr.data:hover > *{opacity:1}

/* entrance motion — never leave cells stuck at opacity 0 if animation is skipped */
.tr.data > *{opacity:1}
.table.stagger .tr.data > *{animation:rowIn .5s cubic-bezier(.22,.61,.21,1) both;animation-delay:calc(var(--i,0) * 42ms)}
.table:not(.stagger) .tr.data > *{animation:rowFade .2s ease both}
.table.stagger .speed-fill{animation:barIn .8s cubic-bezier(.22,.61,.21,1) both;animation-delay:calc(.2s + var(--i,0) * 42ms)}
@keyframes rowIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes rowFade{from{opacity:0}to{opacity:1}}
@keyframes barIn{from{width:0}}
@media (prefers-reduced-motion: reduce){
  .table.stagger .tr.data > *,.table:not(.stagger) .tr.data > *,.table.stagger .speed-fill{animation:none}
  .mast h1::after,.tag.live::before,.board-bar .b-live::before{animation:none}
  *{transition:none}
}

/* header cells */
.th{
  display:inline-flex;align-items:center;gap:6px;user-select:none;white-space:nowrap;
  font:600 10px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted2);
}
.th.sortable{cursor:pointer;padding:4px 6px;margin:-4px -6px;border:1px solid transparent;transition:color .15s ease,border-color .15s ease,background .15s ease}
.th.sortable:hover{color:var(--text);border-color:var(--line2);background:var(--panel2)}
.th.sortable.active{color:var(--accent-text)}
.sort-ind{font-size:9px;min-width:9px;font-weight:700;transform:translateY(-.5px)}
.th-e2e_tps,.th-gen_tps,.th-ttft,.th-wall,.th-in_tokens,.th-out_tokens{justify-content:flex-end;text-align:right}
.th-rank{justify-content:flex-end}

/* tooltip */
.tip{
  position:relative;display:inline-flex;align-items:center;justify-content:center;
  width:13px;height:13px;border:1px solid var(--line2);
  color:var(--muted2);font:600 9px/1 var(--mono);cursor:help;flex:0 0 auto;
  transition:border-color .15s ease,color .15s ease;
}
.tip:hover,.tip:focus{color:var(--accent-text);border-color:var(--accent-text);outline:none}
.tip[data-tip]:hover::after,.tip[data-tip]:focus::after{
  content:attr(data-tip);position:absolute;left:50%;top:calc(100% + 9px);transform:translateX(-50%);
  width:max-content;max-width:250px;padding:9px 11px;z-index:30;
  background:var(--tip-bg);border:1px solid var(--tip-border);color:var(--text);
  font:400 12px/1.55 var(--sans);letter-spacing:0;text-transform:none;box-shadow:0 12px 30px rgba(0,0,0,.3);
  pointer-events:none;white-space:normal;text-align:left;
}

/* data cells */
.rank{
  position:relative;
  justify-content:flex-end;
  font:600 11px/1 var(--mono);color:var(--muted2);font-variant-numeric:tabular-nums;letter-spacing:.05em;
  cursor:help;
}
.rank.top{color:var(--accent-text)}
.rank-pop{
  display:none;position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);
  z-index:40;min-width:196px;max-width:280px;padding:10px 12px;border-radius:8px;
  background:var(--tip-bg);border:1px solid var(--tip-border);color:var(--text);
  box-shadow:0 12px 32px rgba(0,0,0,.28);pointer-events:none;text-align:left;
  font:500 12px/1.55 var(--sans);letter-spacing:0;white-space:normal;
}
.rank-pop .rp-title{display:block;margin:0 0 6px;color:var(--muted2);font:600 10px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.rank-pop .rp-line{display:block;font:500 12px/1.55 var(--mono);color:var(--text);white-space:nowrap}
.rank-pop .rp-empty{color:var(--muted)}
.rank:hover .rank-pop,.rank:focus-within .rank-pop{display:block}
@media (max-width:720px){
  .rank-pop{left:0;transform:none}
}
.cell-with-logo{display:flex;align-items:center;gap:9px;min-width:0}
.logo{width:19px;height:19px;object-fit:contain;flex:0 0 auto;display:block;background:transparent;border:0;padding:0}
.logo.harness{width:19px;height:19px}
.model-name{font-weight:650;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.15px;min-width:0}
.chip{
  display:inline-flex;align-items:center;border:1px solid var(--pill-border);background:var(--pill-bg);
  color:var(--muted);padding:2px 8px;font:500 10px/1.6 var(--mono);
  letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;
}
.harness-cell{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);min-width:0}
.harness-cell span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.metric{font:600 13px/1.2 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.2px;justify-content:flex-end}
.metric small{font-size:9.5px;color:var(--muted2);font-weight:500;margin-left:3px;letter-spacing:0}
.metric.na{color:var(--muted2);font-weight:500}
.speed-cell{min-width:108px;flex-direction:column;align-items:stretch;justify-content:center;gap:0}
.speed-cell .metric{align-self:flex-end}
.speed-track{width:100%;height:3px;background:var(--track);margin-top:7px;overflow:hidden}
.speed-fill{
  height:100%;max-width:100%;
  background:linear-gradient(90deg,var(--bar-from),var(--bar-to));
  opacity:.75;
}
.tr.data:first-child .speed-fill{opacity:1}
.plain{font:500 11.5px/1.2 var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;letter-spacing:-.1px}
.rate-hi{color:var(--good)}.rate-mid{color:var(--warn)}.rate-lo{color:var(--dim)}
.ttft.fast{color:var(--good)}.ttft.mid{color:var(--warn)}.ttft.slow{color:var(--dim)}
.num{font:500 12px/1.2 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;justify-content:flex-end}
.empty{padding:60px 20px;text-align:center;color:var(--muted2);font:500 12px/1.6 var(--mono);letter-spacing:.06em}

/* ============ explainer ============ */
.explainer{
  margin:80px auto 72px;max-width:640px;width:100%;color:var(--muted);
  font-size:13.5px;line-height:1.85;text-align:left;
  word-break:keep-all;line-break:strict;overflow-wrap:anywhere;
}
.explainer h2{
  margin:0 0 20px;font-size:24px;color:var(--text);font-weight:750;letter-spacing:-.02em;
  display:flex;align-items:center;justify-content:center;gap:12px;text-align:center;
}
.explainer h2::before{content:"+";font:600 18px/1 var(--mono);color:var(--accent-text)}
.explainer h3{
  margin:28px 0 10px;font:600 10.5px/1.4 var(--mono);color:var(--muted2);
  letter-spacing:.16em;text-transform:uppercase;display:flex;align-items:center;gap:9px;
}
.explainer h3::before{content:"";width:14px;height:1px;background:var(--accent);flex:0 0 auto}
.explainer p{margin:0 0 10px}
.explainer .metric-list{margin:0;padding:0;list-style:none}
.explainer .metric-list li{margin:0 0 8px;padding-left:0}
.explainer strong{color:var(--text);font-weight:650}
.explainer code{font:500 .9em var(--mono);background:var(--pill-bg);border:1px solid var(--pill-border);padding:1px 5px;color:var(--text)}
.explainer a{color:var(--accent-text);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;text-decoration-color:color-mix(in srgb,currentColor 45%,transparent)}
.explainer a:hover{text-decoration-color:currentColor}

@media(max-width:720px){
  .shell{padding:0 16px}
  .mast{padding:40px 0 26px}
  .table{padding:0 2px}
  .tr > *{padding:9px 8px}
}
</style>
</head>
<body>
<header class="topbar"><div class="shell">
  <div class="brand"><img id="site-logo" src="logos/site-logo-dark.svg" alt="" width="24" height="24" /><span class="brand-word">Agent&nbsp;<span>Speed</span></span></div>
  <div class="top-actions">
    <button type="button" class="icon-btn" id="theme-toggle" aria-label="Theme" title="Theme"></button>
    <a class="icon-btn" id="github-link" href="https://github.com/TuTouPower/agent_speed" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.009-.868-.014-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
    </a>
    <button type="button" class="icon-btn" id="lang-toggle" aria-label="Language" title="Language"><span class="lang-glyph" id="lang-glyph">EN</span></button>
  </div>
</div></header>

<section class="mast"><div class="shell">
  <div class="mast-tags" id="meta-strip"></div>
  <h1 id="hero-title"></h1>
  <p id="hero-sub"></p>
  <div class="hairline" aria-hidden="true"></div>
</div></section>

<main class="shell main-shell">
  <div class="board-frame">
    <i class="x-corner tl">+</i><i class="x-corner tr">+</i><i class="x-corner bl">+</i><i class="x-corner br">+</i>
    <section class="board" aria-label="leaderboard">
      <div class="board-bar"><span class="b-live" id="board-bar-left"></span><span id="board-bar-right"></span></div>
      <div class="table-wrap"><div class="table">
        <div class="tr head" id="thead"></div>
        <div id="rows"></div>
      </div></div>
    </section>
  </div>

  <section class="explainer" id="about"></section>
</main>

<script>
(() => {
  const DATA_URL = "./latest.json";
  const THEME_KEY = "agent-speed-theme";
  const LANG_KEY = "agent-speed-lang";

  const I18N = {
    zh: {
      docTitle: "Agent Speed — Coding Agent 速度基准",
      heroTitle: "大模型速度测试",
      heroSub: "",
      themeSystem: "跟随系统",
      themeDark: "深色",
      themeLight: "浅色",
      langSwitch: "Switch to English",
      empty: "暂无数据",
      loadFail: "加载失败：",
      tagScenario: "场景",
      tagScenarioVal: "200K 长上下文",
      tagCells: "成绩",
      tagCellsVal: "组",
      tagUpdated: "更新",
      rankTipTitle: "参与汇总的测次",
      rankTipEmpty: "无测次时间",
      boardLeft: "实时榜单 / LEADERBOARD",
      boardRight: (n) => `${String(n).padStart(2, "0")} ROWS`,
      cols: {
        model: "模型",
        source: "来源",
        effort: "思考强度",
        harness: "客户端",
        e2e_tps: "端到端速度",
        gen_tps: "生成速度",
        ttft: "首字延迟",
        wall: "总耗时",
        in_tokens: "输入",
        out_tokens: "输出",
      },
      tips: {
        model: "参与评测的模型名称。",
        source: "服务来源 / 线路（官方、网关或代理渠道）。",
        effort: "思考强度档位。不支持调节时显示为 —。",
        harness: "运行框架 / 客户端（如 opencode、kimi-code、grok-build）。",
        e2e_tps: "端到端速度：输出 token 数 ÷ 总耗时（含排队、读入、思考、生成）。越高越快。",
        gen_tps: "生成速度：只统计模型真正在往外写字的那段时间。拿不到生成时间窗时显示 —。",
        ttft: "首字延迟（秒），从发出请求到看到第一个字，含思考。越低越好。",
        wall: "总耗时（秒）：从发出请求到全部输出完成一共花了多少秒。",
        in_tokens: "账单输入 token 的中位数（按服务商事件流口径）。",
        out_tokens: "账单输出 token 的中位数（按服务商事件流口径）。",
      },
      about: `<h2>实验说明</h2>
        <p>这是公开的 coding agent / 推理模型<strong>速度</strong>榜，只比快慢，不评回答质量。<strong>速度不是能力排名。</strong></p>
        <h3>怎么测</h3>
        <p>默认 200K 长上下文：固定 Django 语料 + 公开任务 prompt，禁止工具调用。</p>
        <p>每个「模型 × 来源 × 思考强度 × 客户端」会跑多次。</p>
        <h3>指标</h3>
        <ul class="metric-list">
          <li><strong>端到端速度</strong>：输出 token ÷ 总耗时（含排队、读入、思考、生成），越高越快。</li>
          <li><strong>生成速度</strong>：只统计生成窗口；拿不到生成窗时留空。</li>
          <li><strong>首字延迟</strong>：等到第一个字出现的秒数（含思考），越低越好。</li>
          <li><strong>总耗时</strong>：从发出请求到全部输出完成的秒数。</li>
          <li><strong>输入 / 输出</strong>：账单 token 中位数。</li>
        </ul>
        <h3>怎么上榜</h3>
        <p>每个格子取数据库里<strong>最近 2 次有效成功</strong>算中位数（可以跨不同 batch，不要求同一次 bench 凑满 2 次）。</p>
        <p>单次须成功、输出 token ≥ 500；这两次的账单输入中位数还要 ≥ 场景切片 cl100k 的一半（200K 场景下 ≥ 100,000）。</p>
        <h3>数据从哪来</h3>
        <p>页面读同目录 <code>latest.json</code>（评测仓用 <code>report.py</code> 从 <code>results.jsonl</code> 生成）。数据与页面一起发布。</p>
        <p>评测仓：<a href="https://github.com/TuTouPower/agent_speed" target="_blank" rel="noopener">TuTouPower/agent_speed</a>。</p>
      `,
    },
    en: {
      docTitle: "Agent Speed — Coding Agent Speed Benchmark",
      heroTitle: "LLM Speed Benchmark",
      heroSub: "",
      themeSystem: "System",
      themeDark: "Dark",
      themeLight: "Light",
      langSwitch: "切换到中文",
      empty: "No data yet",
      loadFail: "Failed to load: ",
      tagScenario: "Scenario",
      tagScenarioVal: "200K context",
      tagCells: "Cells",
      tagCellsVal: "",
      tagUpdated: "Updated",
      rankTipTitle: "Runs used",
      rankTipEmpty: "No run timestamps",
      boardLeft: "Live board / LEADERBOARD",
      boardRight: (n) => `${String(n).padStart(2, "0")} ROWS`,
      cols: {
        model: "Model",
        source: "Source",
        effort: "Effort",
        harness: "Client",
        e2e_tps: "End-to-end",
        gen_tps: "Generation",
        ttft: "Time to first token",
        wall: "Total time",
        in_tokens: "Input",
        out_tokens: "Output",
      },
      tips: {
        model: "Model under test.",
        source: "Provider / route (official, gateway, or proxy).",
        effort: "Reasoning effort. Shows — when not adjustable.",
        harness: "Client / harness (e.g. opencode, kimi-code, grok-build).",
        e2e_tps: "End-to-end speed: output tokens ÷ total elapsed time (queue, ingest, thinking, generation). Higher is faster.",
        gen_tps: "Generation speed: only the window where tokens are actually streaming. Shows — when that window is unavailable.",
        ttft: "Seconds from request to the first output token, including thinking. Lower is better.",
        wall: "Total elapsed seconds from sending the request until all output finished.",
        in_tokens: "Median billed input tokens (provider event-stream accounting).",
        out_tokens: "Median billed output tokens (provider event-stream accounting).",
      },
      about: `<h2>About</h2>
        <p>A public <strong>speed</strong> board for coding agents / reasoning models. It measures speed only — not answer quality. <strong>Speed is not a capability ranking.</strong></p>
        <h3>How we measure</h3>
        <p>Default scenario is 200K long context: fixed Django corpus + public task prompt, tools disabled.</p>
        <p>Each model × source × effort × harness cell is run multiple times.</p>
        <h3>Metrics</h3>
        <ul class="metric-list">
          <li><strong>E2E speed</strong>: output tokens ÷ total elapsed time (queue, read, think, generate) — higher is faster.</li>
          <li><strong>Gen speed</strong>: generate-window only; blank when unavailable.</li>
          <li><strong>TTFT</strong>: seconds until first token (incl. thinking) — lower is better.</li>
          <li><strong>Total time</strong>: seconds from request to finished output.</li>
          <li><strong>Input / Output</strong>: median billed tokens.</li>
        </ul>
        <h3>Listing rules</h3>
        <p>Per cell we take the <strong>latest 2 valid successes</strong> in the database (may span batches; same-bench pair not required).</p>
        <p>Each run must succeed with output tokens ≥ 500; median billed input of those two must be ≥ half the scenario cl100k slice (≥ 100,000 for 200K).</p>
        <h3>Data</h3>
        <p>The page loads sibling <code>latest.json</code> (from <code>report.py</code> over <code>results.jsonl</code>). Data ships with the static page.</p>
        <p>Repo: <a href="https://github.com/TuTouPower/agent_speed" target="_blank" rel="noopener">TuTouPower/agent_speed</a>.</p>
      `,
    },
  };

  // light = for light background; dark = for dark background (浅色描边/白标)
  const MODEL_LOGO = [
    [/deepseek/i, { light: "logos/deepseek.svg", dark: "logos/deepseek.svg" }],
    [/gemini/i, { light: "logos/gemini.svg", dark: "logos/gemini.svg" }],
    [/gpt|openai/i, { light: "logos/openai.svg", dark: "logos/openai-light.svg" }],
    [/grok/i, { light: "logos/grok.svg", dark: "logos/grok-light.svg" }],
    [/^k2|kimi|moonshot/i, { light: "logos/kimi-dark.svg", dark: "logos/kimi-light.svg" }],
    [/mimo/i, { light: "logos/mimo.svg", dark: "logos/mimo-light.svg" }],
    [/muse|spark/i, { light: "logos/muse.svg", dark: "logos/muse-light.svg" }],
  ];
  const HARNESS_LOGO = {
    "opencode": { light: "logos/opencode.svg", dark: "logos/opencode-light.svg" },
    "grok-build": { light: "logos/grok.svg", dark: "logos/grok-light.svg" },
    "kimi-code": { light: "logos/kimi-dark.svg", dark: "logos/kimi-light.svg" },
    "kimi": { light: "logos/kimi-dark.svg", dark: "logos/kimi-light.svg" },
    "antigravity": { light: "logos/antigravity.svg", dark: "logos/antigravity.svg" },
    "codex": { light: "logos/codex.svg", dark: "logos/codex.svg" },
  };

  const COLS = [
    { key: "model", sortable: true, tip: false },
    { key: "e2e_tps", sortable: true },
    { key: "gen_tps", sortable: true },
    { key: "ttft", sortable: true },
    { key: "wall", sortable: true },
    { key: "effort", sortable: true, tip: false },
    { key: "harness", sortable: true },
    { key: "in_tokens", sortable: true },
    { key: "out_tokens", sortable: true },
    { key: "source", sortable: true },
  ];

  const ICONS = {
    sun: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>`,
    moon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 14.5A8.5 8.5 0 1111.5 3a7 7 0 009.5 11.5z"/></svg>`,
    monitor: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>`,
  };

  const state = {
    rows: [],
    sortKey: "e2e_tps",
    sortDir: "desc",
    error: null,
    lang: "zh",
    theme: "system",
    firstPaint: true,
  };

  const $ = (s) => document.querySelector(s);
  const t = () => I18N[state.lang];

  function detectLang() {
    const saved = localStorage.getItem(LANG_KEY);
    if (saved === "zh" || saved === "en") return saved;
    const nav = (navigator.language || "en").toLowerCase();
    return nav.startsWith("zh") ? "zh" : "en";
  }

  function fmtToks(n) {
    if (n == null || Number.isNaN(Number(n))) return "—";
    const v = Number(n);
    if (v >= 1e6) return (v / 1e6).toFixed(v >= 1e7 ? 1 : 2).replace(/\.0$/, "") + "M";
    if (v >= 1000) {
      const k = v / 1000;
      return (k >= 100 ? Math.round(k).toString() : k.toFixed(1).replace(/\.0$/, "")) + "K";
    }
    return String(Math.round(v));
  }
  function fmtRate(n) {
    if (n == null || Number.isNaN(Number(n))) return null;
    return Number(n).toFixed(1);
  }
  function fmtSec(n) {
    if (n == null || Number.isNaN(Number(n))) return null;
    const v = Number(n);
    return (Math.round(v * 1000) / 1000).toLocaleString("en-US", { maximumFractionDigits: 3 });
  }
  function effortText(e) { return e == null || e === "" ? "" : String(e); }
  function effectiveDark() {
    if (state.theme === "dark") return true;
    if (state.theme === "light") return false;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function pickLogo(spec) {
    if (!spec) return null;
    if (typeof spec === "string") return spec;
    return effectiveDark() ? (spec.dark || spec.light) : (spec.light || spec.dark);
  }
  function modelLogo(name) {
    for (const [re, spec] of MODEL_LOGO) if (re.test(name || "")) return pickLogo(spec);
    return null;
  }
  function harnessLogo(h) { return pickLogo(HARNESS_LOGO[h]); }
  function logoImg(src, cls = "logo") {
    return src ? `<img class="${cls}" src="${src}" alt="" loading="lazy" decoding="async" />` : "";
  }
  function ttftClass(v) { return v == null ? "" : v < 12 ? "fast" : v < 25 ? "mid" : "slow"; }
  // 生成速度: >=200 / >=100 / rest; 端到端: >=100 / >=50 / rest
  function genClass(v) { return v == null ? "na" : v >= 200 ? "rate-hi" : v >= 100 ? "rate-mid" : "rate-lo"; }
  function e2eClass(v) { return v == null ? "na" : v >= 100 ? "rate-hi" : v >= 50 ? "rate-mid" : "rate-lo"; }


  function themeLabel(mode) {
    const i = t();
    return mode === "light" ? i.themeLight : mode === "dark" ? i.themeDark : i.themeSystem;
  }
  function themeIcon(mode) {
    return mode === "light" ? ICONS.sun : mode === "dark" ? ICONS.moon : ICONS.monitor;
  }
  function applyTheme(mode) {
    state.theme = mode;
    const root = document.documentElement;
    if (mode === "light" || mode === "dark") root.setAttribute("data-theme", mode);
    else root.removeAttribute("data-theme");
    const btn = $("#theme-toggle");
    const label = themeLabel(mode);
    btn.innerHTML = themeIcon(mode);
    btn.title = label;
    btn.setAttribute("aria-label", label);
    const logo = $("#site-logo");
    if (logo) logo.src = effectiveDark() ? "logos/site-logo-dark.svg" : "logos/site-logo-light.svg";
    renderRows();
  }
  function applyLang(lang) {
    state.lang = lang;
    localStorage.setItem(LANG_KEY, lang);
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.title = t().docTitle;
    $("#lang-glyph").textContent = lang === "zh" ? "EN" : "中";
    const lb = $("#lang-toggle");
    lb.title = t().langSwitch;
    lb.setAttribute("aria-label", t().langSwitch);
    $("#hero-title").textContent = t().heroTitle;
    const sub = $("#hero-sub");
    sub.textContent = t().heroSub || "";
    sub.hidden = !t().heroSub;
    $("#about").innerHTML = t().about;
    applyTheme(state.theme);
    renderHead();
    renderMeta();
    renderRows();
  }

  function renderMeta() {
    const i = t();
    const el = $("#meta-strip");
    if (!el) return;
    const tags = [];
    tags.push(`<span class="tag live"><i>${i.tagScenario}</i>${i.tagScenarioVal}</span>`);
    if (state.rows.length) {
      tags.push(`<span class="tag"><i>${i.tagCells}</i>${state.rows.length} ${i.tagCellsVal}</span>`);
    }
    el.innerHTML = tags.join("");
    const bl = $("#board-bar-left");
    if (bl) bl.textContent = i.boardLeft;
    const br = $("#board-bar-right");
    if (br) br.textContent = state.rows.length ? i.boardRight(state.rows.length) : "";
  }

  function sortedRows() {
    const key = state.sortKey;
    const dir = state.sortDir;
    const textKeys = new Set(["model", "effort", "harness", "source"]);
    return [...state.rows].sort((x, y) => {
      const xv = x[key], yv = y[key];
      if (textKeys.has(key)) {
        const xs = xv == null || xv === "" ? null : String(xv);
        const ys = yv == null || yv === "" ? null : String(yv);
        if (xs == null && ys == null) return 0;
        if (xs == null) return 1;
        if (ys == null) return -1;
        const diff = xs.localeCompare(ys, "zh", { sensitivity: "base", numeric: true });
        return dir === "asc" ? diff : -diff;
      }
      const xn = xv == null || xv === "" || Number.isNaN(Number(xv));
      const yn = yv == null || yv === "" || Number.isNaN(Number(yv));
      if (xn && yn) return 0;
      if (xn) return 1;
      if (yn) return -1;
      const diff = Number(xv) - Number(yv);
      return dir === "asc" ? diff : -diff;
    });
  }

  function renderHead() {
    const i = t();
    const cells = COLS.map((c) => {
      const tip = c.tip === false ? "" : `<span class="tip" tabindex="0" data-tip="${i.tips[c.key]}">?</span>`;
      if (!c.sortable) {
        return `<div class="th th-${c.key}">${i.cols[c.key]}${tip ? " " + tip : ""}</div>`;
      }
      const active = state.sortKey === c.key;
      const ind = active ? (state.sortDir === "asc" ? "↑" : "↓") : "";
      return `<div class="th sortable th-${c.key} ${active ? "active" : ""}" data-sort="${c.key}">${i.cols[c.key]} <span class="sort-ind" aria-hidden="true">${ind}</span>${tip ? " " + tip : ""}</div>`;
    });
    $("#thead").innerHTML = `<div class="th th-rank">#</div>` + cells.join("");
    $("#thead").querySelectorAll(".th.sortable").forEach((th) => {
      th.addEventListener("click", (e) => {
        if (e.target.closest(".tip")) return;
        const key = th.dataset.sort;
        if (state.sortKey === key) {
          state.sortDir = state.sortDir === "desc" ? "asc" : "desc";
        } else {
          state.sortKey = key;
          state.sortDir = (key === "ttft" || key === "wall" || key === "model" || key === "effort" || key === "harness" || key === "source") ? "asc" : "desc";
        }
        state.firstPaint = false;
        renderHead();
        renderRows();
      });
    });
  }


  function formatSampleTimes(times) {
    if (!Array.isArray(times) || !times.length) return [];
    const loc = state.lang === "zh" ? "zh-CN" : "en-US";
    return times.map((raw) => {
      const d = new Date(raw);
      if (Number.isNaN(d.getTime())) return String(raw);
      return d.toLocaleString(loc, {
        year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false,
      });
    });
  }

  function rankPopHtml(r) {
    const i = t();
    const lines = formatSampleTimes(r.sample_times);
    const body = lines.length
      ? lines.map((line) => `<span class="rp-line">${line}</span>`).join("")
      : `<span class="rp-empty">${i.rankTipEmpty}</span>`;
    return `<div class="rank-pop" role="tooltip"><span class="rp-title">${i.rankTipTitle}</span>${body}</div>`;
  }

  function renderRows() {
    const i = t();
    const rowsEl = $("#rows");
    const tableEl = document.querySelector(".table");
    if (state.error) {
      if (tableEl) { tableEl.classList.add("is-empty"); tableEl.classList.remove("stagger"); }
      rowsEl.innerHTML = `<div class="empty">${i.loadFail}${state.error}</div>`;
      return;
    }
    const rows = sortedRows();
    const maxE2e = Math.max(...rows.map((r) => Number(r.e2e_tps) || 0), 1);
    const maxGen = Math.max(...rows.map((r) => Number(r.gen_tps) || 0), 1);
    if (!rows.length) {
      if (tableEl) { tableEl.classList.add("is-empty"); tableEl.classList.remove("stagger"); }
      rowsEl.innerHTML = `<div class="empty">${i.empty}</div>`;
      return;
    }
    if (tableEl) {
      tableEl.classList.remove("is-empty");
      tableEl.classList.toggle("stagger", state.firstPaint);
    }
    rowsEl.innerHTML = rows.map((r, idx) => {
      const e2e = fmtRate(r.e2e_tps);
      const gen = fmtRate(r.gen_tps);
      const ttft = fmtSec(r.ttft);
      const wall = fmtSec(r.wall);
      const e2eBar = Math.max(0, Math.min(100, ((Number(r.e2e_tps) || 0) / maxE2e) * 100));
      const genBar = r.gen_tps == null ? 0 : Math.max(0, Math.min(100, (Number(r.gen_tps) / maxGen) * 100));
      const effort = effortText(r.effort);
      const rank = String(idx + 1).padStart(2, "0");
      return `<div class="tr data" style="--i:${idx}">
        <div class="rank ${idx < 3 ? "top" : ""}" tabindex="0">${rank}${rankPopHtml(r)}</div>
        <div class="cell-with-logo">${logoImg(modelLogo(r.model))}<div class="model-name">${r.model || "—"}</div></div>
        <div class="speed-cell"><div class="metric ${e2eClass(r.e2e_tps)}">${e2e == null ? "—" : e2e}${e2e == null ? "" : "<small>tok/s</small>"}</div><div class="speed-track"><div class="speed-fill" style="width:${e2eBar}%"></div></div></div>
        <div class="speed-cell"><div class="metric ${genClass(r.gen_tps)}">${gen == null ? "" : gen}${gen == null ? "" : "<small>tok/s</small>"}</div>${r.gen_tps == null ? "" : `<div class="speed-track"><div class="speed-fill" style="width:${genBar}%"></div></div>`}</div>
        <div class="metric ttft ${ttftClass(r.ttft)}">${ttft == null ? "—" : ttft}${ttft == null ? "" : "<small>s</small>"}</div>
        <div class="metric">${wall == null ? "—" : wall}${wall == null ? "" : "<small>s</small>"}</div>
        <div>${effort ? `<span class="chip">${effort}</span>` : ""}</div>
        <div><span class="harness-cell">${logoImg(harnessLogo(r.harness), "logo harness")}<span>${r.harness || "—"}</span></span></div>
        <div class="num">${fmtToks(r.in_tokens)}</div>
        <div class="num">${fmtToks(r.out_tokens)}</div>
        <div class="plain">${r.source || ""}</div>
      </div>`;
    }).join("");
  }

  // theme cycle: system → dark → light → system
  state.theme = localStorage.getItem(THEME_KEY) || "system";
  if (!["system", "dark", "light"].includes(state.theme)) state.theme = "system";
  // 点一下切到「当前实际显示」的反色；系统已是深色时不会再空切到深色
  $("#theme-toggle").onclick = () => {
    const next = effectiveDark() ? "light" : "dark";
    localStorage.setItem(THEME_KEY, next);
    applyTheme(next);
  };
  if (window.matchMedia) {
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
      if (state.theme === "system") renderRows();
    });
  }
  $("#lang-toggle").onclick = () => applyLang(state.lang === "zh" ? "en" : "zh");

  applyLang(detectLang());

  async function load() {
    try {
      const res = await fetch(DATA_URL, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      state.rows = Array.isArray(data) ? data : (data && Array.isArray(data.rows) ? data.rows : (() => { throw new Error("bad latest.json"); })());
      state.error = null;
      renderMeta();
      renderRows();
      // stagger only once; keep cells visible after entrance
      requestAnimationFrame(() => { state.firstPaint = false; });
    } catch (e) {
      state.rows = [];
      state.error = e.message || String(e);
      renderRows();
    }
  }
  load();
})();
</script>
</body>
</html>
